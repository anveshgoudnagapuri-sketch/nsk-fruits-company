<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NSK FRUITS COMPANY - Order Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f6f6f6;padding-bottom:90px}
.header{background:#0a7a0a;color:white;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
.slider{height:160px;display:flex;overflow:hidden}
.slide{min-width:100%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;font-size:20px}
.s1{background:linear-gradient(135deg,#ff8c00,#ff4500)} .s2{background:linear-gradient(135deg,#0a7a0a,#2ecc71)} .s3{background:linear-gradient(135deg,#6c3483,#af7ac5)}
.tabs{display:flex;gap:8px;padding:10px;overflow:auto;background:white;position:sticky;top:55px;z-index:9}
.tab{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#eee;white-space:nowrap}
.tab.active{background:#0a7a0a;color:white;border-color:#0a7a0a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:15px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card b{display:block;margin:5px 0}
.price{color:#0a7a0a;font-weight:bold}
.btn{background:#0a7a0a;color:white;border:none;padding:7px 14px;border-radius:20px;margin-top:6px;width:100%}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee;border-radius:20px 20px 0 0}
.b-item{text-align:center;font-size:12px;position:relative}
.cart-count{background:red;color:white;border-radius:50%;padding:2px 6px;font-size:10px;position:absolute;top:-5px;right:5px}
#cartPage{position:fixed;top:0;left:0;right:0;bottom:0;background:white;z-index:99;display:none;padding:15px;overflow:auto}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.orderBtn{background:#25D366;color:white;border:none;padding:14px;width:100%;border-radius:10px;font-size:16px;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<div class="header">🍎 NSK FRUITS COMPANY - Laxmipuram, Warangal<br><small>📞 9494110853 | Prop: N. Sathish Kumar</small></div>

<div class="slider" id="sl"><div class="slide s1">🥭 FRESH MANGO ₹120/kg</div><div class="slide s2">🍊 COMBO OFFER - Free Delivery</div><div class="slide s3">📦 Order Now - Same Day Delivery</div></div>

<div class="tabs">
<button class="tab active" onclick="filterF('all',this)">All</button>
<button class="tab" onclick="filterF('mango',this)">Mango</button>
<button class="tab" onclick="filterF('citrus',this)">Santra/Mozambi</button>
<button class="tab" onclick="filterF('daily',this)">Banana/Coconut</button>
<button class="tab" onclick="filterF('premium',this)">Jaana/Anaar</button>
</div>

<div class="grid" id="grid"></div>

<div class="bottom">
<div class="b-item" onclick="showHome()">🏠<br>Home</div>
<div class="b-item" onclick="document.getElementById('grid').scrollIntoView()">🔍<br>Shop</div>
<div class="b-item" onclick="openCart()">🛒<br>Cart <span class="cart-count" id="cc">0</span></div>
<div class="b-item" onclick="window.open('https://wa.me/919494110853')">💬<br>Chat</div>
</div>

<div id="cartPage">
<h2>🛒 Your Cart</h2><div id="cartItems" style="margin:15px 0"></div>
<h3>Delivery Details</h3>
<input id="cname" placeholder="Your Name">
<input id="cphone" placeholder="Phone Number">
<input id="caddr" placeholder="Address - Laxmipuram / Warangal">
<p><b>Total: ₹<span id="total">0</span></b></p>
<button class="orderBtn" onclick="placeOrder()">✅ Place Order on WhatsApp</button>
<button onclick="closeCart()" style="width:100%;padding:10px;margin-top:10px;border-radius:8px">Continue Shopping</button>
</div>

<script>
let products=[
{id:1,name:"Banganapalli Mango",cat:"mango",price:120,unit:"1kg",icon:"🥭"},
{id:2,name:"Mozambi",cat:"citrus",price:60,unit:"1kg",icon:"🍋"},
{id:3,name:"Santra / Orange",cat:"citrus",price:80,unit:"1kg",icon:"🍊"},
{id:4,name:"Banana",cat:"daily",price:50,unit:"Dozen",icon:"🍌"},
{id:5,name:"Coconut",cat:"daily",price:30,unit:"1pc",icon:"🥥"},
{id:6,name:"Jaana",cat:"premium",price:150,unit:"1kg",icon:"🍎"},
{id:7,name:"Anaar / Pomegranate",cat:"premium",price:180,unit:"1kg",icon:"🔴"},
];
let cart=[];
function render(list){
let h="";list.forEach(p=>{h+=`<div class="card"><div style="font-size:45px">${p.icon}</div><b>${p.name}</b><small>${p.unit}</small><div class="price">₹${p.price}</div><button class="btn" onclick="addToCart(${p.id})">+ Add to Cart</button></div>`});
document.getElementById("grid").innerHTML=h;
}
render(products);
function filterF(cat,el){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));el.classList.add("active");if(cat=='all')render(products);else render(products.filter(p=>p.cat==cat));}
function addToCart(id){let p=products.find(x=>x.id==id);let ex=cart.find(x=>x.id==id);if(ex)ex.qty++;else cart.push({...p,qty:1});updateCart();alert(p.name+" added!")}
function updateCart(){let c=cart.reduce((a,b)=>a+b.qty,0);document.getElementById("cc").innerText=c;let total=cart.reduce((a,b)=>a+(b.price*b.qty),0);document.getElementById("total").innerText=total;let html="";cart.forEach(i=>{html+=`<div style="display:flex;justify-content:space-between;background:#f5f5f5;padding:8px;border-radius:8px;margin:5px 0"><span>${i.icon} ${i.name} x ${i.qty}</span><span>₹${i.price*i.qty} <button onclick="remove(${i.id})">❌</button></span></div>`});document.getElementById("cartItems").innerHTML=html||"Cart empty";}
function remove(id){cart=cart.filter(x=>x.id!=id);updateCart();}
function openCart(){document.getElementById("cartPage").style.display="block";updateCart();}
function closeCart(){document.getElementById("cartPage").style.display="none";}
function showHome(){closeCart();window.scrollTo(0,0);}
function placeOrder(){
let name=document.getElementById("cname").value;let phone=document.getElementById("cphone").value;let addr=document.getElementById("caddr").value;
if(!name||!phone||cart.length==0){alert("Name, Phone & Cart required!");return;}
let total=document.getElementById("total").innerText;
let msg=`*NEW ORDER - NSK FRUITS COMPANY*%0A%0AName: ${name}%0APhone: ${phone}%0AAddress: ${addr}%0A%0A*Items:*%0A`;
cart.forEach(i=>{msg+=`${i.name} x ${i.qty} = ₹${i.price*i.qty}%0A`});
msg+=`%0A*Total: ₹${total}*%0A%0AFrom Website: anveshdesigns.com`;
window.open(`https://wa.me/919494110853?text=${msg}`,"_blank");
}
let sIdx=0;setInterval(()=>{sIdx=(sIdx+1)%3;document.getElementById("sl").scrollTo({left:sIdx*window.innerWidth,behavior:'smooth'})},2500);
</script>
</body>
</html>
